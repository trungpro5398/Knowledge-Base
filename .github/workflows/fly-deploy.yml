name: Fly API Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "Dockerfile.api"
      - "fly.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-api-deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Align KB API with shared Supabase project
        run: >-
          flyctl secrets set
          SUPABASE_URL=https://uztcacnnwmupfslegwfj.supabase.co
          SUPABASE_JWKS_URL=https://uztcacnnwmupfslegwfj.supabase.co/auth/v1/.well-known/jwks.json
          CORS_ORIGINS=https://kb.tet-edu.com,https://knowledge-base-web-xi.vercel.app,https://knowledge-base-web-git-main-techfives-projects.vercel.app
          --app knowledge-base-api

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
